name: One-time read-only Striven link discovery

on:
  push:
    branches: [claude/todays-preinspections-ihzvr6]
    paths: [ops/links-discover.mjs, .github/workflows/links-discover-once.yml]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      STRIVEN_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      STRIVEN_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node ops/links-discover.mjs
