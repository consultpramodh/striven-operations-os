name: Live Striven Metadata Verification

on:
  # One controlled automatic run when this workflow is first introduced.
  # After verification, keep this workflow manual-only.
  push:
    branches:
      - stage-0-tenant-discovery
    paths:
      - ".github/workflows/live-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-metadata:
    runs-on: ubuntu-latest
    environment: striven-readonly
    env:
      STRIVEN_CLIENT_ID: ${{ secrets.STRIVEN_CLIENT_ID || secrets.CLIENT_ID }}
      STRIVEN_CLIENT_SECRET: ${{ secrets.STRIVEN_CLIENT_SECRET || secrets.CLIENT_SECRET }}
      STRIVEN_BASE_URL: https://api.striven.com
      STAGE0_PAGE_SIZE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fail closed if credentials are unavailable
        shell: bash
        run: |
          if [ -z "$STRIVEN_CLIENT_ID" ] || [ -z "$STRIVEN_CLIENT_SECRET" ]; then
            echo "Required Striven repository secrets were not resolved."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Static correctness gates
        run: npm run verify:static

      - name: Run read-only metadata probes
        run: npm run live:metadata
