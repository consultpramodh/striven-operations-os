name: Live Striven Metadata Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-metadata:
    runs-on: ubuntu-latest
    env:
      STRIVEN_CLIENT_ID: ${{ secrets.STRIVEN_CLIENT_ID || secrets.CLIENT_ID || secrets.STRIVEN_CLIENTID || secrets.CLIENTID || vars.STRIVEN_CLIENT_ID || vars.CLIENT_ID }}
      STRIVEN_CLIENT_SECRET: ${{ secrets.STRIVEN_CLIENT_SECRET || secrets.CLIENT_SECRET || secrets.STRIVEN_CLIENTSECRET || secrets.CLIENTSECRET }}
      STRIVEN_BASE_URL: https://api.striven.com
      STAGE0_PAGE_SIZE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fail closed if credentials are unavailable
        shell: bash
        run: |
          missing=0
          if [ -z "$STRIVEN_CLIENT_ID" ]; then
            echo "Striven Client ID was not resolved."
            missing=1
          fi
          if [ -z "$STRIVEN_CLIENT_SECRET" ]; then
            echo "Striven Client Secret was not resolved from GitHub Actions Secrets."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Use repository Actions secret STRIVEN_CLIENT_SECRET (or CLIENT_SECRET)."
            echo "Client ID may be an Actions secret or variable."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Static correctness gates
        run: npm run verify:static

      - name: Run read-only metadata probes
        run: npm run live:metadata
