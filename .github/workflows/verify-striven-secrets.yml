name: Verify Striven Secrets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-striven-secrets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret-presence:
    runs-on: ubuntu-latest
    env:
      STRIVEN_CLIENT_ID_A: ${{ secrets.STRIVEN_CLIENT_ID }}
      STRIVEN_CLIENT_ID_B: ${{ secrets.CLIENT_ID }}
      STRIVEN_CLIENT_ID_C: ${{ secrets.STRIVEN_CLIENTID }}
      STRIVEN_CLIENT_ID_D: ${{ secrets.CLIENTID }}
      STRIVEN_CLIENT_SECRET_A: ${{ secrets.STRIVEN_CLIENT_SECRET }}
      STRIVEN_CLIENT_SECRET_B: ${{ secrets.CLIENT_SECRET }}
      STRIVEN_CLIENT_SECRET_C: ${{ secrets.STRIVEN_CLIENTSECRET }}
      STRIVEN_CLIENT_SECRET_D: ${{ secrets.CLIENTSECRET }}

    steps:
      - name: Check Client ID presence
        shell: bash
        run: |
          if [ -n "$STRIVEN_CLIENT_ID_A" ] || [ -n "$STRIVEN_CLIENT_ID_B" ] || [ -n "$STRIVEN_CLIENT_ID_C" ] || [ -n "$STRIVEN_CLIENT_ID_D" ]; then
            echo "Client ID secret resolved: YES"
          else
            echo "Client ID secret resolved: NO"
            exit 1
          fi

      - name: Check Client Secret presence
        shell: bash
        run: |
          if [ -n "$STRIVEN_CLIENT_SECRET_A" ] || [ -n "$STRIVEN_CLIENT_SECRET_B" ] || [ -n "$STRIVEN_CLIENT_SECRET_C" ] || [ -n "$STRIVEN_CLIENT_SECRET_D" ]; then
            echo "Client Secret secret resolved: YES"
          else
            echo "Client Secret secret resolved: NO"
            exit 1
          fi
