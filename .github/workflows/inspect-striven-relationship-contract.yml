name: Inspect Striven Relationship Contract

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-striven-relationship-contract.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public relationship schemas
        shell: python
        run: |
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://api.striven.com/swagger/v1/swagger.json",
              headers={
                  "User-Agent": "Mozilla/5.0 StrivenOperationsOS/0.1",
                  "Accept": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              spec = json.load(response)

          schemas = spec.get("components", {}).get("schemas", {})

          def ref_name(ref):
              return ref.rsplit("/", 1)[-1] if isinstance(ref, str) else None

          def flatten(schema, seen=None):
              seen = set() if seen is None else set(seen)
              out = {}
              if not isinstance(schema, dict):
                  return out

              ref = schema.get("$ref")
              if ref:
                  name = ref_name(ref)
                  if name and name not in seen and name in schemas:
                      seen.add(name)
                      out.update(flatten(schemas[name], seen))

              for part in schema.get("allOf", []):
                  out.update(flatten(part, seen))

              out.update(schema.get("properties", {}))
              return out

          print("TASK_SEARCH_REQUEST")
          op = spec["paths"]["/v1/Tasks/Search"]["post"]
          rb = op.get("requestBody", {}).get("content", {}).get("application/json", {}).get("schema", {})
          props = flatten(rb)
          print(",".join(sorted(props.keys())))

          print("TASK_SEARCH_SCHEMAS")
          for name in ["TaskSearchParams", "TaskSearchParameters"]:
              if name in schemas:
                  print(name + ": " + ",".join(sorted(flatten(schemas[name]).keys())))

          print("SALES_ORDER_TASK_FIELDS")
          for name, schema in sorted(schemas.items()):
              if "order" not in name.lower():
                  continue
              fields = [
                  key for key in flatten(schema)
                  if "task" in key.lower()
              ]
              if fields:
                  print(name + ": " + ",".join(sorted(fields)))

          print("TASK_DETAIL_RELATIONSHIP_FIELDS")
          for name in ["Task", "TaskDetail", "TaskResult", "TaskSearchResult"]:
              if name in schemas:
                  fields = [
                      key for key in flatten(schemas[name])
                      if any(token in key.lower() for token in ["order", "sales", "account", "customer"])
                  ]
                  print(name + ": " + ",".join(sorted(fields)))
