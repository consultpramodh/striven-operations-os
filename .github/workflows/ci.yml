name: CI

on:
  push:
    branches:
      - main
      - stage-0-tenant-discovery
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate agent skills
        run: npm run validate:skills

      - name: Typecheck
        run: npm run typecheck
