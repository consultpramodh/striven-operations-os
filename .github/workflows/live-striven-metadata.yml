name: Live Striven Metadata Verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/live-striven-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-metadata:
    runs-on: ubuntu-latest
    env:
      STRIVEN_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      STRIVEN_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      STRIVEN_BASE_URL: https://api.striven.com
      STAGE0_PAGE_SIZE: "1"

    steps:
      - name: Checkout Stage 0 branch
        uses: actions/checkout@v4
        with:
          ref: stage-0-tenant-discovery

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify credentials are available
        shell: bash
        run: |
          if [ -z "$STRIVEN_CLIENT_ID" ] || [ -z "$STRIVEN_CLIENT_SECRET" ]; then
            echo "Striven credentials were not resolved."
            exit 1
          fi
          echo "Striven credentials resolved: YES"

      - name: Install dependencies
        run: npm install

      - name: Static correctness gates
        run: npm run verify:static

      - name: Run read-only live metadata verification
        run: npm run live:metadata
